name: Vocabulary integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: read-all
concurrency:
  group: vocabulary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRAFT_REQUIRE_VOCABULARY: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          needs: check
      - name: Build pinned data-dict CLI
        shell: bash
        run: |
          git clone https://github.com/tidyverse/data-dict.git "$RUNNER_TEMP/data-dict"
          git -C "$RUNNER_TEMP/data-dict" checkout --detach 0161d460b6eb70d337028f8eddbf2f443bcb8f67
          cargo build --manifest-path "$RUNNER_TEMP/data-dict/Cargo.toml" --release --locked -p data-dict-cli
          printf 'DATA_DICT=%s\n' "$RUNNER_TEMP/data-dict/target/release/data-dict" >> "$GITHUB_ENV"
      - name: Verify vocabulary publication and offline reads
        shell: Rscript {0}
        run: testthat::test_local(filter = "^vocabulary$", stop_on_failure = TRUE)
