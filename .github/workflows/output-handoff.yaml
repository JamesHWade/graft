name: Completed output handoff

on:
  pull_request:
    paths:
      - tools/output-handoff/**
      - R/**
      - DESCRIPTION
      - .github/workflows/output-handoff.yaml
  push:
    branches: [main]
    paths:
      - tools/output-handoff/**
      - R/**
      - DESCRIPTION
      - .github/workflows/output-handoff.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: output-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Producer sources are loaded from verified archives by run.R.
          # Installing their dependencies here affects only this CI library.
          extra-packages: |
            commons=posit-dev/commons/pkg-r@c1d97d6f5dea094580213198842173af5d299c47
            deputy=JamesHWade/deputy@0ab9862330627b053c4a9870bd5f1300d0829768
            datadict=tidyverse/data-dict/r@0161d460b6eb70d337028f8eddbf2f443bcb8f67
            ellmer@0.5.0
            any::httpuv
            any::promises
            any::later
      - name: Prepare pinned public sources
        shell: bash
        run: Rscript tools/output-handoff/prepare.R "$RUNNER_TEMP/handoff-sources"
      - name: Verify the completed output handoff
        shell: bash
        run: Rscript tools/output-handoff/run.R --sources "$RUNNER_TEMP/handoff-sources"
