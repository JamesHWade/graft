name: PostgreSQL artifacts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: graft_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GRAFT_TEST_POSTGRES: 'true'
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: graft_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::DBI, any::RPostgres
          needs: check
      - name: Verify artifact isolation and transactions
        run: testthat::test_local(filter = '^artifact-')
        shell: Rscript {0}
