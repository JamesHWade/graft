on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

name: Artifact and memory experiments

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  artifact-portability:
    name: Artifact portability (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: local::.
          extra-packages: any::callr, any::testthat, any::withr
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          install-pandoc: false
          install-quarto: false
      - name: Test artifact replacement and selection lifecycle on Windows
        shell: Rscript {0}
        run: |
          options(graft.experiment.checkout = normalizePath("."))
          testthat::test_dir("tools/experiments/artifacts/tests", stop_on_failure = TRUE)

  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: '4.6.1'
      - name: Choose isolated dependency and evidence paths
        shell: bash
        run: |
          printf '%s\n' \
            "GRAFT_EXPERIMENT_HOME=$RUNNER_TEMP/graft-experiment-dependencies" \
            "R_LIBS_USER=$RUNNER_TEMP/graft-experiment-dependencies/library" \
            "GRAFT_EXPERIMENT_OUTPUT=$RUNNER_TEMP/graft-experiment-evidence" >> "$GITHUB_ENV"
      - name: Read pinned dependency references
        id: pins
        shell: python
        run: |
          import json
          import os
          with open("tools/experiments/pins.json") as stream:
              pins = json.load(stream)
          refs = []
          for pin in pins["packages"]:
              path = pin["repository"]
              if pin["subdir"]:
                  path += "/" + pin["subdir"]
              refs.append(path + "@" + pin["sha"])
          with open("tools/experiments/dependency-snapshot.json") as stream:
              snapshot = json.load(stream)
          source_packages = {pin["package"] for pin in pins["packages"]} | {"graft"}
          refs.extend(name + "@" + version for name, version in snapshot["packages"].items()
                      if name not in source_packages)
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("packages=" + ", ".join(refs) + "\n")
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: local::.
          extra-packages: ${{ steps.pins.outputs.packages }}
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          install-pandoc: false
          install-quarto: false
      - name: Verify pins and rebuild CLI despite a damaged legacy source cache
        env:
          GRAFT_EXPERIMENT_SKIP_R_INSTALL: "true"
        shell: Rscript {0}
        run: |
          pins <- jsonlite::read_json("tools/experiments/pins.json")
          pin <- Filter(function(x) x$package == pins$data_dict_cli_package, pins$packages)[[1]]
          legacy_source <- file.path(Sys.getenv("GRAFT_EXPERIMENT_HOME"), paste0("data-dict-", pin$sha))
          dir.create(legacy_source, recursive = TRUE)
          marker <- file.path(legacy_source, "Cargo.toml")
          writeLines("invalid legacy cached source", marker)
          source("tools/experiments/setup.R")
          stopifnot(identical(readLines(marker), "invalid legacy cached source"))
      - name: Run both artifact backends and integration experiments offline
        run: Rscript tools/experiments/run.R
      - name: Preserve dependency and experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-memory-experiment-evidence
          path: |
            ${{ runner.temp }}/graft-experiment-dependencies/versions.json
            ${{ runner.temp }}/graft-experiment-evidence
          if-no-files-found: warn
