on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

name: Artifact and memory experiments

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Choose isolated dependency and evidence paths
        shell: bash
        run: |
          printf '%s\n' \
            "GRAFT_EXPERIMENT_HOME=$RUNNER_TEMP/graft-experiment-dependencies" \
            "R_LIBS_USER=$RUNNER_TEMP/graft-experiment-dependencies/library" \
            "GRAFT_EXPERIMENT_OUTPUT=$RUNNER_TEMP/graft-experiment-evidence" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Read pinned dependency references
        id: pins
        shell: python
        run: |
          import json
          import os
          with open("tools/experiments/pins.json") as stream:
              pins = json.load(stream)
          refs = []
          for pin in pins["packages"]:
              path = pin["repository"]
              if pin["subdir"]:
                  path += "/" + pin["subdir"]
              refs.append(path + "@" + pin["sha"])
          refs.extend("any::" + name for name in pins["extra_packages"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("packages=" + ", ".join(refs) + "\n")
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: local::.
          extra-packages: ${{ steps.pins.outputs.packages }}
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          install-pandoc: false
          install-quarto: false
      - name: Verify pinned R sources and build matching data-dict CLI
        env:
          GRAFT_EXPERIMENT_SKIP_R_INSTALL: "true"
        run: Rscript tools/experiments/setup.R
      - name: Run both artifact backends and integration experiments offline
        run: Rscript tools/experiments/run.R
      - name: Preserve dependency and experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-memory-experiment-evidence
          path: |
            ${{ runner.temp }}/graft-experiment-dependencies/versions.json
            ${{ runner.temp }}/graft-experiment-evidence
          if-no-files-found: warn
