id: https://w3id.org/graft/examples/market-intelligence
name: graft-market-intelligence
title: Graft materials market intelligence
version: 0.1.0
prefixes:
  market: https://w3id.org/graft/examples/market-intelligence/
  graft: https://w3id.org/graft/
  linkml: https://w3id.org/linkml/
default_prefix: market
default_range: string

enums:
  MaterialityLevel:
    permissible_values:
      monitor:
      material:
      urgent:
  AssessmentStatus:
    permissible_values:
      accepted:
      superseded:
  ActionStatus:
    permissible_values:
      open:
      complete:
      declined:
  RunStatus:
    permissible_values:
      succeeded:

slots:
  id:
    identifier: true
    range: uriorcurie
    required: true
    pattern: "^market:[A-Za-z0-9._~-]+$"
  name:
    range: string
    required: true
  description:
    range: string
  segment:
    range: string
  business:
    range: Business
  businesses:
    range: Business
    multivalued: true
  competitors:
    range: Competitor
    multivalued: true
  downstream_markets:
    range: DownstreamMarket
    multivalued: true
  source:
    range: SourceDocument
    required: true
  source_documents:
    range: SourceDocument
    multivalued: true
    required: true
  observations:
    range: Observation
    multivalued: true
    required: true
  assessment:
    range: Assessment
    required: true
  title:
    range: string
    required: true
  uri:
    range: uri
    required: true
  source_type:
    range: string
    required: true
  published_at:
    range: datetime
    required: true
  observed_at:
    range: datetime
    required: true
  statement:
    range: string
    required: true
  metric_name:
    range: string
  metric_value:
    range: float
  metric_unit:
    range: string
  signal_type:
    range: string
    required: true
  direction:
    range: string
    required: true
  headline:
    range: string
    required: true
  summary:
    range: string
    required: true
  implication:
    range: string
    required: true
  materiality:
    range: MaterialityLevel
    required: true
  confidence:
    range: float
    required: true
  status:
    range: AssessmentStatus
    required: true
  valid_from:
    range: datetime
    required: true
  accepted_at:
    range: datetime
    required: true
  action_title:
    range: string
    required: true
  owner:
    range: string
    required: true
  action_status:
    range: ActionStatus
    required: true
  due_date:
    range: date
    required: true
  run_status:
    range: RunStatus
    required: true
  workflow_run_id:
    range: string
    required: true
  scan_date:
    range: date
    required: true
  planning_engine:
    range: string
    required: true
  memory_used:
    range: boolean
    required: true
  approval_id:
    range: string
    required: true
  reviewer:
    range: string
    required: true
  note:
    range: string

classes:
  Business:
    slots:
      - id
      - name
      - segment
      - description
    annotations:
      graft.label_slot:
        tag: graft.label_slot
        value: name
      graft.search_slots:
        tag: graft.search_slots
        value: "name, segment, description"

  Competitor:
    slots:
      - id
      - name
      - description
    annotations:
      graft.label_slot:
        tag: graft.label_slot
        value: name
      graft.search_slots:
        tag: graft.search_slots
        value: "name, description"

  DownstreamMarket:
    slots:
      - id
      - name
      - description
    annotations:
      graft.label_slot:
        tag: graft.label_slot
        value: name
      graft.search_slots:
        tag: graft.search_slots
        value: "name, description"

  SourceDocument:
    slots:
      - id
      - title
      - uri
      - source_type
      - published_at
    annotations:
      graft.label_slot:
        tag: graft.label_slot
        value: title
      graft.search_slots:
        tag: graft.search_slots
        value: "title, uri, source_type"

  Observation:
    slots:
      - id
      - source
      - businesses
      - competitors
      - downstream_markets
      - observed_at
      - statement
      - metric_name
      - metric_value
      - metric_unit
      - signal_type
      - direction
    annotations:
      graft.label_slot:
        tag: graft.label_slot
        value: statement
      graft.search_slots:
        tag: graft.search_slots
        value: "statement, metric_name, signal_type, direction"

  Assessment:
    slots:
      - id
      - headline
      - summary
      - implication
      - materiality
      - confidence
      - status
      - businesses
      - competitors
      - downstream_markets
      - observations
      - valid_from
      - accepted_at
    annotations:
      graft.label_slot:
        tag: graft.label_slot
        value: headline
      graft.search_slots:
        tag: graft.search_slots
        value: "headline, summary, implication, materiality"

  IntelligenceAction:
    slots:
      - id
      - assessment
      - action_title
      - owner
      - action_status
      - due_date
    annotations:
      graft.label_slot:
        tag: graft.label_slot
        value: action_title
      graft.search_slots:
        tag: graft.search_slots
        value: "action_title, owner, action_status"

  MonitorRun:
    slots:
      - id
      - title
      - scan_date
      - run_status
      - workflow_run_id
      - planning_engine
      - memory_used
      - source_documents
      - assessment
      - approval_id
      - reviewer
      - note
    annotations:
      graft.label_slot:
        tag: graft.label_slot
        value: title
      graft.search_slots:
        tag: graft.search_slots
        value: "title, workflow_run_id, reviewer, note"
