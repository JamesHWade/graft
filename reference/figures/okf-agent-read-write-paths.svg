<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Graft separates reading accepted knowledge from accepting proposed knowledge</title>
  <desc id="desc">The read lane verifies a current OKF snapshot and returns bounded accepted evidence without mutation. The write lane treats an edited OKF record as a proposal, validates it with LinkML, requires approval of the exact plan, commits through Graft to DuckDB, and then resynchronizes OKF.</desc>
  <style>
    :root {
      --bg: #f7faf8;
      --surface: #ffffff;
      --surface-soft: #eef7f3;
      --surface-warm: #fff6e8;
      --ink: #18211e;
      --muted: #5b6863;
      --forest: #176b52;
      --forest-deep: #12362d;
      --leaf: #2f8f6b;
      --mint: #ddf3eb;
      --amber: #c98224;
      --border: #cbd9d3;
      --line: #82a99b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101916;
        --surface: #16231f;
        --surface-soft: #1a2b25;
        --surface-warm: #33281b;
        --ink: #edf7f3;
        --muted: #aabbb4;
        --forest: #79d6b5;
        --forest-deep: #d9f5ea;
        --leaf: #79d6b5;
        --mint: #224a3e;
        --amber: #efb661;
        --border: #365248;
        --line: #79a995;
      }
    }
    text {
      fill: var(--ink);
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
    }
    .eyebrow {
      fill: var(--muted);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .lane-title {
      font-size: 27px;
      font-weight: 700;
    }
    .step {
      font-size: 19px;
      font-weight: 700;
    }
    .copy {
      fill: var(--muted);
      font-size: 16px;
    }
    .mono {
      font-family: "IBM Plex Mono", "SFMono-Regular", monospace;
      font-size: 15px;
      font-weight: 600;
    }
    .box {
      fill: var(--surface);
      stroke: var(--border);
      stroke-width: 2;
    }
    .box-soft {
      fill: var(--surface-soft);
      stroke: var(--forest);
      stroke-width: 2;
    }
    .box-warm {
      fill: var(--surface-warm);
      stroke: var(--amber);
      stroke-width: 2;
    }
    .line {
      fill: none;
      stroke: var(--line);
      stroke-linecap: round;
      stroke-width: 4;
    }
    .line-strong {
      fill: none;
      stroke: var(--forest);
      stroke-linecap: round;
      stroke-width: 5;
    }
    .pill {
      fill: var(--mint);
    }
    .pill-warm {
      fill: var(--surface-warm);
    }
    .pill-text {
      fill: var(--forest-deep);
      font-size: 15px;
      font-weight: 700;
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--forest)"/>
    </marker>
  </defs>

  <rect x="12" y="12" width="1176" height="696" rx="28" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <text class="eyebrow" x="600" y="54" text-anchor="middle">ASYMMETRIC BY DESIGN · EASY TO READ, DELIBERATE TO CHANGE</text>

  <rect class="box-soft" x="55" y="86" width="1090" height="230" rx="26"/>
  <rect x="55" y="86" width="14" height="230" rx="7" fill="var(--forest)"/>
  <text class="eyebrow" x="100" y="125">READ PATH</text>
  <text class="lane-title" x="100" y="163">Accepted evidence, no mutation</text>

  <rect class="box" x="100" y="196" width="205" height="86" rx="18"/>
  <text class="step" x="124" y="228">Person or agent</text>
  <text class="copy" x="124" y="255">asks a bounded question</text>

  <rect class="box" x="382" y="196" width="205" height="86" rx="18"/>
  <text class="step mono" x="406" y="228">kg_okf_context()</text>
  <text class="copy" x="406" y="255">checks current status</text>

  <rect class="box" x="664" y="196" width="205" height="86" rx="18"/>
  <text class="step" x="688" y="228">Stable snapshot</text>
  <text class="copy" x="688" y="255">digest + byte limits</text>

  <rect class="box" x="946" y="196" width="150" height="86" rx="18"/>
  <text class="step" x="970" y="228">Context</text>
  <text class="copy" x="970" y="255">accepted only</text>

  <path class="line-strong" d="M305 239 L382 239" marker-end="url(#arrow-strong)"/>
  <path class="line-strong" d="M587 239 L664 239" marker-end="url(#arrow-strong)"/>
  <path class="line-strong" d="M869 239 L946 239" marker-end="url(#arrow-strong)"/>

  <rect class="box-warm" x="55" y="372" width="1090" height="292" rx="26"/>
  <rect x="55" y="372" width="14" height="292" rx="7" fill="var(--amber)"/>
  <text class="eyebrow" x="100" y="411">WRITE PATH</text>
  <text class="lane-title" x="100" y="449">Proposal → validation → approval → commit</text>

  <rect class="box" x="100" y="486" width="170" height="96" rx="18"/>
  <text class="step" x="122" y="518">Edit OKF</text>
  <text class="copy" x="122" y="545">structured proposal</text>
  <text class="copy" x="122" y="566">outside ledger</text>

  <rect class="box" x="314" y="486" width="170" height="96" rx="18"/>
  <text class="step" x="336" y="518">Plan</text>
  <text class="copy" x="336" y="545">snapshot + diff</text>
  <text class="copy" x="336" y="566">tamper-evident</text>

  <rect class="box" x="528" y="486" width="170" height="96" rx="18"/>
  <text class="step" x="550" y="518">Validate</text>
  <text class="copy" x="550" y="545">LinkML contract</text>
  <text class="copy" x="550" y="566">identity + shape</text>

  <path d="M789 480 L862 534 L789 588 L716 534 Z" fill="var(--surface)" stroke="var(--amber)" stroke-width="3"/>
  <text class="step" x="789" y="529" text-anchor="middle">Approve</text>
  <text class="copy" x="789" y="554" text-anchor="middle">exact plan</text>

  <rect class="box-soft" x="906" y="486" width="190" height="96" rx="18"/>
  <text class="step" x="928" y="518">Commit</text>
  <text class="copy" x="928" y="545">Graft → DuckDB</text>
  <text class="copy" x="928" y="566">then resync OKF</text>

  <path class="line" d="M270 534 L314 534" marker-end="url(#arrow)"/>
  <path class="line" d="M484 534 L528 534" marker-end="url(#arrow)"/>
  <path class="line" d="M698 534 L716 534" marker-end="url(#arrow)"/>
  <path class="line-strong" d="M862 534 L906 534" marker-end="url(#arrow-strong)"/>

  <rect class="pill-warm" x="122" y="603" width="172" height="32" rx="16"/>
  <text class="pill-text" x="208" y="625" text-anchor="middle">not accepted knowledge</text>
  <rect class="pill" x="904" y="603" width="194" height="32" rx="16"/>
  <text class="pill-text" x="1001" y="625" text-anchor="middle">only mutation boundary</text>
</svg>
