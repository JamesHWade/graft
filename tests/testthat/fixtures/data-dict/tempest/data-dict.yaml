$version: 0.1.0
$learn_more: https://data-dict.tidyverse.org/
name: tempest-artifacts
label: Tempest research artifacts
description: >
  Entities, sources, claims, evidence, mentions, and runs produced by a
  Tempest research workflow.
details: >
  This fixture is a table-native projection of the Tempest LinkML contract.
  It preserves validation-friendly structure while documenting the Graft
  semantics that data-dict cannot encode directly.
origin: ../../tempest-schema/tempest-artifacts.linkml.yaml
version:
  number: 0.1.0
tables:
  - name: entity
    label: Entities
    description: Each row is one resolved domain entity.
    details: >
      The source class is a Graft node with resolve-exact identity and uses
      preferred_name as its label and primary search field.
    columns:
      - name: id
        label: Entity ID
        description: Stable Graft identifier for the entity.
        type: string
        constraints: [primary_key]
        examples: ["entity:aspirin", "entity:acetaminophen"]
      - name: preferred_name
        label: Preferred name
        description: Preferred display name for the entity.
        type: string
        constraints: [required]
        examples: ["Aspirin", "Acetaminophen"]
      - name: description
        description: Human-readable summary of the entity.
        type: string
        examples:
          - "Nonsteroidal anti-inflammatory drug."
          - "Analgesic and antipyretic medication."
      - name: inchikey
        label: InChIKey
        description: >
          Chemical structure identifier normalized by Graft as an external
          identifier.
        type: string
        examples:
          - "BSYNRYMUTXBXSQ-UHFFFAOYSA-N"
          - "RZVAJINKPMORJF-UHFFFAOYSA-N"
      - name: cas_number
        label: CAS Registry Number
        description: CAS external identifier, when known.
        type: string
        examples: ["50-78-2", "103-90-2"]
      - name: created_at
        description: Time at which the accepted entity was created.
        type: datetime
        time_zone: UTC
        range: [2026-01-01T00:00:00, .inf]
      - name: updated_at
        description: Time at which the accepted entity was last updated.
        type: datetime
        time_zone: UTC
        range: [2026-01-01T00:00:00, .inf]
    constraints:
      - assert: >
          inchikey IS NULL OR inchikey SIMILAR TO
          '[A-Z]{14}-[A-Z]{10}-[A-Z]'
        description: InChIKeys use the standard 14-10-1 uppercase shape.

  - name: source
    label: Sources
    description: Each row is one source document or external resource.
    details: >
      The source class uses resolve-exact identity. URI, DOI, and content hash
      are external identifiers in the Graft contract.
    columns:
      - name: id
        label: Source ID
        description: Stable Graft identifier for the source.
        type: string
        constraints: [primary_key]
        examples: ["source:paper-1", "source:report-7"]
      - name: uri
        label: Canonical URI
        description: Canonical location of the source.
        type: string
        examples:
          - "https://example.org/papers/1"
          - "https://doi.org/10.1000/example"
      - name: title
        description: Human-readable source title.
        type: string
        examples:
          - "A controlled study of analgesic response"
          - "Evidence synthesis report"
      - name: content_hash
        description: Digest of the source content used during extraction.
        type: string
        examples: ["sha256:4d2f", "sha256:9a70"]
      - name: doi
        label: DOI
        description: Digital Object Identifier, when assigned.
        type: string
        examples: ["10.1000/example", "10.5555/report.7"]
      - name: access_notes
        label: Access notes
        description: >
          Internal notes about source access restrictions. Fixture examples
          are synthetic and contain no credentials or confidential data.
        display: restricted
        type: string
        examples:
          - "Available under a data-use agreement."
          - "Reviewer access only."
      - name: created_at
        description: Time at which the accepted source was created.
        type: datetime
        time_zone: UTC
        range: [2026-01-01T00:00:00, .inf]
      - name: updated_at
        description: Time at which the accepted source was last updated.
        type: datetime
        time_zone: UTC
        range: [2026-01-01T00:00:00, .inf]

  - name: claim
    label: Narrative claims
    description: Each row is one narrative statement extracted or proposed.
    details: >
      The original Graft class has statement role, narrative shape, mint
      identity, and an origin key formed from statement_text plus about.
      Those behaviors are descriptive here rather than executable metadata.
    columns:
      - name: id
        label: Claim ID
        description: Stable Graft identifier for the claim.
        type: string
        constraints: [primary_key]
        examples: ["claim:001", "claim:002"]
      - name: statement_text
        label: Statement
        description: Human-readable text of the narrative claim.
        type: string
        constraints: [required]
        examples:
          - "Aspirin reduced pain relative to placebo."
          - "The result was consistent across sensitivity analyses."
      - name: claim_type
        description: Analytical role of the claim.
        type: enum
        values: [finding, observation, recommendation]
      - name: importance
        description: Importance assigned during synthesis.
        type: enum
        values: [low, medium, high]
      - name: confidence
        description: Confidence score assigned to the statement.
        type: number
        examples: [0, 0.5, 0.8, 0.95, 1]
      - name: polarity
        description: Whether the statement is positive, negative, or uncertain.
        type: enum
        values: [negative, positive, uncertain]
      - name: status
        description: Lifecycle status of the statement.
        type: enum
        values: [active, retracted, superseded]
      - name: primary_subject
        description: Primary entity discussed by the statement.
        type: string
        constraints: [foreign_key]
        examples: ["entity:aspirin", "entity:acetaminophen"]
      - name: superseded_by
        description: >
          Identifier of a replacement Graft statement. This is not marked as
          a data-dict foreign key because the target is polymorphic across
          narrative and semantic statement tables.
        type: string
        examples: ["claim:010", "semantic-claim:011"]
      - name: asserted_at
        description: Time at which the statement was asserted.
        type: datetime
        time_zone: UTC
        range: [2026-01-01T00:00:00, .inf]
      - name: valid_from
        description: Beginning of the statement's validity interval.
        type: datetime
        time_zone: UTC
        range: [2020-01-01T00:00:00, .inf]
      - name: valid_to
        description: End of the statement's validity interval.
        type: datetime
        time_zone: UTC
        range: [2020-01-01T00:00:00, .inf]
    constraints:
      - assert: confidence IS NULL OR confidence BETWEEN 0 AND 1
        description: Confidence is bounded inclusively from zero to one.
      - assert: >
          valid_from IS NULL OR valid_to IS NULL OR valid_from <= valid_to
        description: A validity interval cannot end before it begins.

  - name: claim_about
    label: Claim subjects
    description: Each row links one narrative claim to one entity it concerns.
    details: >
      This bridge represents the required, multivalued Claim.about LinkML
      object reference. The original predicate URI is not represented.
    columns:
      - name: id
        description: Stable identifier for this claim-to-entity relationship.
        type: string
        constraints: [primary_key]
        examples:
          - "claim-about:claim-001:entity-001"
          - "claim-about:claim-002:entity-002"
      - name: claim_id
        description: Narrative claim participating in the relationship.
        type: string
        constraints: [required, foreign_key]
        examples: ["claim:001", "claim:002"]
      - name: entity_id
        description: Entity discussed by the claim.
        type: string
        constraints: [required, foreign_key]
        examples: ["entity:aspirin", "entity:acetaminophen"]

  - name: semantic_claim
    label: Semantic claims
    description: Each row is one machine-readable subject-predicate-object claim.
    details: >
      The source class has statement role, semantic shape, mint identity, and
      qualifier slots for measurement_method and temperature.
    columns:
      - name: id
        label: Semantic claim ID
        description: Stable Graft identifier for the semantic claim.
        type: string
        constraints: [primary_key]
        examples: ["semantic-claim:001", "semantic-claim:002"]
      - name: subject
        description: Entity at the subject end of the semantic statement.
        type: string
        constraints: [required, foreign_key]
        examples: ["entity:aspirin", "entity:acetaminophen"]
      - name: predicate
        description: URI or CURIE naming the semantic relationship.
        type: string
        constraints: [required]
        examples: ["tempest:reduces", "tempest:measured_at"]
      - name: object_entity
        description: Entity-valued object, when the claim targets an entity.
        type: string
        constraints: [foreign_key]
        examples: ["entity:pain", "entity:fever"]
      - name: object_value
        description: Literal-valued object, when the claim targets a value.
        type: string
        examples: ["clinically meaningful", "37.2"]
      - name: object_datatype
        description: Datatype URI or CURIE for a literal object.
        type: string
        examples: ["xsd:string", "xsd:decimal"]
      - name: derived_from_statement
        description: Narrative claim from which this semantic claim was derived.
        type: string
        constraints: [foreign_key]
        examples: ["claim:001", "claim:002"]
      - name: measurement_method
        description: Method used to obtain the qualified measurement.
        type: string
        examples: ["oral thermometer", "visual analog scale"]
      - name: temperature
        description: Temperature qualifier expressed in degrees Celsius.
        type: number(quantity)
        units: Cel
        range: [-273.15, .inf]
      - name: confidence
        description: Confidence score assigned to the statement.
        type: number
        examples: [0, 0.5, 0.8, 0.95, 1]
      - name: polarity
        description: Whether the statement is positive, negative, or uncertain.
        type: enum
        values: [negative, positive, uncertain]
      - name: status
        description: Lifecycle status of the statement.
        type: enum
        values: [active, retracted, superseded]
      - name: superseded_by
        description: >
          Identifier of a replacement Graft statement. The polymorphic target
          cannot be expressed as one data-dict relationship.
        type: string
        examples: ["claim:010", "semantic-claim:011"]
      - name: valid_from
        description: Beginning of the statement's validity interval.
        type: datetime
        time_zone: UTC
        range: [2020-01-01T00:00:00, .inf]
      - name: valid_to
        description: End of the statement's validity interval.
        type: datetime
        time_zone: UTC
        range: [2020-01-01T00:00:00, .inf]
    constraints:
      - assert: >
          (object_entity IS NOT NULL AND object_value IS NULL) OR
          (object_entity IS NULL AND object_value IS NOT NULL)
        description: Exactly one semantic object representation is present.
      - assert: confidence IS NULL OR confidence BETWEEN 0 AND 1
        description: Confidence is bounded inclusively from zero to one.
      - assert: >
          valid_from IS NULL OR valid_to IS NULL OR valid_from <= valid_to
        description: A validity interval cannot end before it begins.

  - name: claim_evidence
    label: Claim evidence
    description: Each row links one statement to one supporting source locator.
    details: >
      statement_id can reference either a narrative or semantic statement, so
      it remains a documented string rather than a table-specific foreign key.
    columns:
      - name: id
        label: Evidence ID
        description: Stable Graft identifier for the evidence record.
        type: string
        constraints: [primary_key]
        examples: ["evidence:001", "evidence:002"]
      - name: statement_id
        description: Narrative or semantic statement supported by the evidence.
        type: string
        constraints: [required]
        examples: ["claim:001", "semantic-claim:001"]
      - name: source_id
        description: Source containing the supporting evidence.
        type: string
        constraints: [required, foreign_key]
        examples: ["source:paper-1", "source:report-7"]
      - name: support_type
        description: Relationship between the source excerpt and the statement.
        type: enum
        constraints: [required]
        values: [contradicts, derived_from, mentions, supports]
      - name: locator_type
        description: Kind of locator used within the source.
        type: enum
        values:
          - json_pointer
          - line
          - other
          - page
          - paragraph
          - section
          - timestamp
          - xpath
      - name: locator_value
        description: Source-relative locator value.
        type: string
        examples: ["12", "results", "/claims/0"]
      - name: page_start
        description: First source page covered by the evidence.
        type: number(ordinal)
        range: [1, .inf]
      - name: page_end
        description: Last source page covered by the evidence.
        type: number(ordinal)
        range: [1, .inf]
      - name: excerpt
        description: Verbatim or normalized supporting text.
        type: string
        examples:
          - "Pain scores were lower in the treatment group."
          - "No serious adverse events were observed."
      - name: extraction_method
        description: Method used to extract the evidence record.
        type: string
        examples: ["manual review", "structured extraction"]
      - name: extraction_version
        description: Version of the extraction process.
        type: string
        examples: ["1.0.0", "2.1.0"]
      - name: source_content_hash
        description: Digest of the exact source content used for extraction.
        type: string
        examples: ["sha256:4d2f", "sha256:9a70"]

  - name: entity_mention
    label: Entity mentions
    description: Each row is one source span that mentions an entity.
    columns:
      - name: id
        label: Mention ID
        description: Stable Graft identifier for the mention.
        type: string
        constraints: [primary_key]
        examples: ["mention:001", "mention:002"]
      - name: source_id
        description: Source containing the mention.
        type: string
        constraints: [required, foreign_key]
        examples: ["source:paper-1", "source:report-7"]
      - name: entity_id
        description: Resolved entity, when resolution succeeded.
        type: string
        constraints: [foreign_key]
        examples: ["entity:aspirin", "entity:acetaminophen"]
      - name: surface_form
        description: Text exactly as it appeared in the source.
        type: string
        constraints: [required]
        examples: ["aspirin", "acetaminophen"]
      - name: locator_type
        description: Kind of source locator for the mention.
        type: enum
        values: [line, page, paragraph, section, timestamp]
      - name: locator_value
        description: Source-relative locator value.
        type: string
        examples: ["12", "results", "00:04:17"]

  - name: run
    label: Runs
    description: Each row records one Tempest workflow run.
    details: >
      Graft derives deterministic identity from run_identifier. data-dict can
      preserve uniqueness but not the identifier-generation policy.
    columns:
      - name: id
        label: Run ID
        description: Stable Graft identifier for the run.
        type: string
        constraints: [primary_key]
        examples: ["run:2026-08-06-001", "run:2026-08-06-002"]
      - name: run_identifier
        description: Producer-supplied identifier used for deterministic identity.
        type: string
        constraints: [required, unique]
        examples: ["tempest-001", "tempest-002"]
      - name: name
        description: Human-readable name for the run.
        type: string
        examples: ["Aspirin evidence review", "Analgesic comparison"]

relationships:
  - join: claim.primary_subject = entity.id
    cardinality: many-to-one
    description: Resolves a narrative claim's primary entity.
  - join: claim_about.claim_id = claim.id
    cardinality: many-to-one
    description: Resolves each claim-about row to its narrative claim.
  - join: claim_about.entity_id = entity.id
    cardinality: many-to-one
    description: Resolves each claim-about row to its entity.
  - join: semantic_claim.subject = entity.id
    cardinality: many-to-one
    description: Resolves the subject of a semantic claim.
  - join: semantic_claim.object_entity = entity.id
    cardinality: many-to-one
    description: Resolves an entity-valued semantic object.
  - join: semantic_claim.derived_from_statement = claim.id
    cardinality: many-to-one
    description: Resolves the narrative source of a semantic claim.
  - join: claim_evidence.source_id = source.id
    cardinality: many-to-one
    description: Resolves evidence to its source.
  - join: entity_mention.source_id = source.id
    cardinality: many-to-one
    description: Resolves a mention to its source.
  - join: entity_mention.entity_id = entity.id
    cardinality: many-to-one
    description: Resolves a mention to its entity when known.

glossary:
  narrative claim: >
    Human-readable statement whose meaning is carried primarily by text and
    links to the entities it concerns.
  semantic claim: >
    Subject-predicate-object statement with exactly one entity or literal
    object representation.
  evidence locator: >
    Source-relative position that allows a reviewer to inspect the material
    supporting or contradicting a statement.
  qualifier: >
    Context such as a measurement method or temperature that narrows the
    meaning of a semantic claim without becoming its predicate or object.
  origin key: >
    Graft-specific fields used to resolve repeat observations to one logical
    record before acceptance.
