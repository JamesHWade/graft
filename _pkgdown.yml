url: https://jameshwade.github.io/graft/
title: graft

repo:
  branch: main
  url:
    home: https://github.com/JamesHWade/graft/
    source: https://github.com/JamesHWade/graft/blob/main/
    issue: https://github.com/JamesHWade/graft/issues/
    user: https://github.com/

development:
  mode: auto
  version_label: warning
  version_tooltip: Development documentation

template:
  light-switch: true
  bslib:
    version: 5
    brand: _brand.yml
    pkgdown-nav-height: 72px
    navbar-light-bg: "#EEF7F3"
    navbar-dark-bg: "#12362D"

home:
  title: "graft: Reviewable knowledge changes for R workflows"
  description: >
    Define records with LinkML or data-dict, inspect a read-only change plan,
    accept it atomically, and retrieve current knowledge with its immutable
    history.
  sidebar:
    structure: [links, license, authors, dev]

navbar:
  structure:
    left: [intro, concepts, design, reference, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    concepts:
      text: Concepts
      menu:
        - text: Architecture
          href: articles/architecture.html
        - text: LinkML contract
          href: articles/linkml-schema.html
        - text: data-dict contract
          href: articles/data-dict-schema.html
        - text: Change control
          href: articles/knowledge-change-control.html
        - text: Retrieval and history
          href: articles/retrieval.html
        - text: Open knowledge
          href: articles/open-knowledge-format.html
    design:
      text: v0.1 design
      href: articles/v01-design.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/JamesHWade/graft/
      aria-label: View graft on GitHub

footer:
  structure:
    left: developed_by
    right: [github, built_with]
  components:
    github: Source and issues are available on [GitHub](https://github.com/JamesHWade/graft).

articles:
  - title: Start here
    desc: >
      Complete one provider-free workflow, then understand the package's
      deliberately small design.
    contents:
      - getting-started
      - architecture
      - v01-design
  - title: Core concepts
    desc: >
      Go deeper into the domain contract, acceptance boundary, retrieval
      operations, and readable open-knowledge projection.
    contents:
      - linkml-schema
      - data-dict-schema
      - knowledge-change-control
      - retrieval
      - open-knowledge-format

reference:
  - title: Define and open
    desc: >
      Load the domain contract and manage the store that accepts knowledge
      under it.
    contents:
      - graft_schema
      - graft_open
      - graft_close
  - title: Propose and accept
    desc: >
      Describe a candidate's origin, plan the change without writing, and
      accept it through one atomic commit path.
    contents:
      - graft_provenance
      - graft_plan
      - graft_commit
      - graft_ingest
  - title: Retrieve and inspect
    desc: >
      Read current and historical accepted knowledge through bounded,
      contract-aware operations and projections.
    contents:
      - graft_get
      - graft_find
      - graft_query
      - graft_history
  - title: Synchronize and integrate
    desc: >
      Synchronize the readable working tree, review file edits as proposals,
      and expose accepted retrieval to agents.
    contents:
      - graft_sync
      - graft_status
      - graft_review
      - graft_tools
