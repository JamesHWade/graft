url: https://jameshwade.github.io/graft/
title: graft
template:
  light-switch: true
  bslib:
    version: 5
    brand: _brand.yml
development:
  mode: auto
home:
  title: "graft: Reviewed project memory for R apps and agents"
  description: >
    Keep reviewed findings, definitions, and exact evidence for the next
    conversation, agent, or workflow.
navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github, lightswitch]
articles:
  - title: Learn graft
    contents:
      - getting-started
      - persistent-artifacts
      - shared-vocabulary
      - recall-evaluation
      - architecture
reference:
  - title: Store and save
    contents:
      - graft_store
      - graft_store_postgres
      - graft_save
      - graft_save_file
      - graft_read
      - graft_select
      - graft_read_selection
  - title: Review and recall
    contents:
      - graft_accept
      - graft_withdraw
      - graft_recall
      - graft_history
      - graft_streams
      - graft_tool
  - title: Shared vocabulary
    contents:
      - graft_publish_vocabulary
      - graft_read_vocabulary
  - title: S7 classes
    contents:
      - ArtifactStore
      - LocalArtifactStore
      - PostgresArtifactStore
      - ArtifactRef
      - Artifact
      - ArtifactSelection
      - Decision
      - Recall
      - VocabularyRelease
