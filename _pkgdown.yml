url: https://jameshwade.github.io/graft/
title: graft

repo:
  branch: main
  url:
    home: https://github.com/JamesHWade/graft/
    source: https://github.com/JamesHWade/graft/blob/main/
    issue: https://github.com/JamesHWade/graft/issues/
    user: https://github.com/

development:
  mode: auto
  version_label: warning
  version_tooltip: Development documentation

template:
  light-switch: true
  bslib:
    version: 5
    brand: _brand.yml
    pkgdown-nav-height: 72px
    navbar-light-bg: "#EEF7F3"
    navbar-dark-bg: "#12362D"

home:
  title: "graft: Governed, traceable knowledge for R workflows"
  description: >
    Validate workflow records against a LinkML contract, review changes before
    acceptance, preserve exact revision history, and retrieve knowledge through
    bounded R and agent interfaces.
  sidebar:
    structure: [links, license, authors, dev]

navbar:
  structure:
    left: [intro, contract, change_control, open_knowledge, reference, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    contract:
      text: LinkML contract
      href: articles/linkml-schema.html
    change_control:
      text: Change control
      href: articles/knowledge-change-control.html
    open_knowledge:
      text: Open knowledge
      href: articles/open-knowledge-format.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/JamesHWade/graft/
      aria-label: View graft on GitHub

footer:
  structure:
    left: developed_by
    right: [github, built_with]
  components:
    github: Source and issues are available on [GitHub](https://github.com/JamesHWade/graft).

articles:
  - title: Start here
    desc: >
      Follow the complete provider-free workflow, then go deeper into the
      contract, change-control, and readable open-knowledge boundaries.
    contents:
      - getting-started
      - linkml-schema
      - knowledge-change-control
      - open-knowledge-format

reference:
  - title: Contract and store
    desc: >
      Load a LinkML-derived contract and manage the lifecycle of its Graft
      store.
    contents:
      - graft_schema
      - graft_open
      - graft_close
  - title: Provenance and changes
    desc: >
      Describe candidate origins, plan reviewable changes, and accept them
      through the single atomic commit path.
    contents:
      - graft_provenance
      - graft_plan
      - graft_review
      - graft_commit
      - graft_ingest
  - title: Retrieval and history
    desc: >
      Retrieve current and historical accepted knowledge through bounded,
      contract-aware operations.
    contents:
      - graft_get
      - graft_find
      - graft_query
      - graft_history
  - title: Open knowledge and agents
    desc: >
      Synchronize and inspect the readable OKF working tree or create read-only
      tools backed by accepted retrieval.
    contents:
      - graft_sync
      - graft_status
      - graft_tools
